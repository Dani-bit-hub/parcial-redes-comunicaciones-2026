# Log de acceso de Apache en un archivo propio, para compartirlo por volumen.
# Se usa X-Forwarded-For para registrar la IP del cliente y no la de nginx.
LogFormat "%{X-Forwarded-For}i %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" joomla_xff
CustomLog /var/log/apache2/joomla_access.log joomla_xff