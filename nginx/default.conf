# Formato de log en JSON: el script de Jupyter lo parsea y lo inserta en PostgreSQL
log_format json_logs escape=json
  '{'
    '"time":"$time_iso8601",'
    '"remote_addr":"$remote_addr",'
    '"method":"$request_method",'
    '"uri":"$request_uri",'
    '"status":$status,'
    '"bytes":$body_bytes_sent,'
    '"request_time":$request_time,'
    '"referer":"$http_referer",'
    '"user_agent":"$http_user_agent",'
    '"service":"$svc"'
  '}';

# Necesario para el HTTP Upgrade de los WebSockets
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;

  # DNS embebido de Docker: nginx resuelve los servicios en cada petición
  # (así no se cae al arrancar si un contenedor aún no está listo)
  resolver 127.0.0.11 valid=10s;

  client_max_body_size 50m;

  # Archivo distinto a access.log, porque en la imagen access.log es un symlink a stdout
  access_log /var/log/nginx/access_json.log json_logs;

  # Cabeceras comunes del proxy
  proxy_http_version 1.1;
  proxy_set_header Host $http_host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

    location = /nginx-health {
    access_log off;
    return 200 "ok";
  }

    # Entrar a /jupyter abre directo el cuaderno precargado
  location = /jupyter {
    return 302 /jupyter/lab/tree/work/analisis_datos.ipynb;
  }
  location = /jupyter/ {
    return 302 /jupyter/lab/tree/work/analisis_datos.ipynb;
  }

    location = /inicio {
    set $svc "portal";
    alias /usr/share/nginx/html/inicio.html;
    default_type text/html;
  }

    # Jupyter (base_url=/jupyter), con WebSockets
  location /jupyter {
    set $svc "jupyter";
    set $upstream_jupyter http://jupyter:8888;
    proxy_pass $upstream_jupyter;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 86400;
  }

  # Grafana (serve_from_sub_path=/grafana), Grafana Live también usa WebSockets
  location /grafana {
    set $svc "grafana";
    set $upstream_grafana http://grafana:3000;
    proxy_pass $upstream_grafana;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }

  # Joomla en la raíz
  location / {
    set $svc "joomla";
    set $upstream_joomla http://joomla:80;
    proxy_pass $upstream_joomla;
  }
}